  <div id="modal-leaderboard" class="fixed inset-0 z-50 hidden items-center justify-center p-3 sm:p-5 bg-slate-950/80 backdrop-blur-md overscroll-contain" onclick="if(event.target===this) window.closeLeaderboardModal()">
    <div class="game-modal-shell modal-shell-amber relative w-full max-w-2xl max-h-[92vh] overflow-hidden flex flex-col shadow-2xl animate-in fade-in zoom-in-95 duration-200">
      
      <!-- Leaderboard Header with Grand Gradient & Trophy Icon -->
      <div class="game-modal-header bg-gradient-to-r from-amber-500 via-amber-600 to-indigo-700 px-5 py-4 text-white flex items-center justify-between shadow-md relative overflow-hidden">
        <!-- Floating Watermark Icons -->
        <svg class="ui-watermark -right-3 -top-3 w-28 h-28 text-white/10" aria-hidden="true"><use href="#icon-trophy"></use></svg>
        <svg class="ui-watermark -left-3 -bottom-3 w-28 h-28 text-white/10" aria-hidden="true"><use href="#icon-sparkle"></use></svg>

        <div class="relative z-10 flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center text-2xl shadow-inner text-white">
            <svg class="ui-icon w-6 h-6 text-white" aria-hidden="true"><use href="#icon-trophy"></use></svg>
          </div>
          <div>
            <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-black/20 backdrop-blur-md text-[10px] font-black uppercase tracking-widest text-amber-100 shadow-xs mb-1 border border-white/20">
              <svg class="ui-icon w-3 h-3 text-amber-200" aria-hidden="true"><use href="#icon-crown"></use></svg> EMPIRE STANDINGS
            </div>
            <h2 class="font-rounded font-black text-xl sm:text-2xl tracking-wide drop-shadow-sm flex items-center gap-2">
              <span>TYCOON LEADERBOARD</span>
              <span class="text-[10px] font-black uppercase tracking-widest bg-amber-400 text-slate-950 px-2 py-0.5 rounded-full shadow-xs">LIVE</span>
            </h2>
            <p class="text-xs font-semibold text-amber-100 mt-0.5 flex items-center gap-1.5">
              <span>Real-time net worth & empire rankings</span>
              <span>•</span>
              <span id="leaderboard-match-timer" class="text-white font-bold">15m match</span>
            </p>
          </div>
        </div>
        <button onclick="window.closeLeaderboardModal()" class="relative z-10 w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 text-white flex items-center justify-center cursor-pointer transition text-base shadow-xs border border-white/20" title="Close Leaderboard [Esc]">
          <svg class="ui-icon w-4 h-4 text-white" aria-hidden="true"><use href="#icon-xmark"></use></svg>
        </button>
      </div>

      <!-- Quick Summary / Proximity to Victory Bar -->
      <div id="leaderboard-summary-banner" class="bg-amber-50/90 border-b border-amber-100 px-5 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs font-bold text-amber-950">
        <!-- Filled dynamically -->
      </div>

      <!-- Scrollable Leaderboard Table / Cards -->
      <div class="p-4 sm:p-6 overflow-y-auto space-y-3 flex-1 bg-slate-50/50">
        <div id="leaderboard-players-list" class="space-y-2.5">
          <!-- Dynamically populated rank cards -->
        </div>

        <!-- Live Timeline Chart Section in Leaderboard -->
        <div class="mt-4 pt-3 border-t border-slate-200">
          <div class="text-xs font-black uppercase tracking-wider text-slate-700 mb-2 flex items-center justify-between">
            <span class="flex items-center gap-1.5"><i class="fa-solid fa-chart-line text-sky-600"></i> Net Worth Trajectory Timeline</span>
            <span class="text-[10px] text-slate-400 font-bold">Turn-by-turn history</span>
          </div>
          <div id="leaderboard-timeline-chart" class="w-full h-36 bg-white rounded-2xl border border-slate-200 p-2 overflow-hidden flex items-center justify-center"></div>
        </div>
      </div>

      <!-- Footer Info & Close Button -->
      <div class="bg-white border-t border-slate-200 px-5 py-3 flex items-center justify-between text-xs text-slate-500">
        <div class="flex items-center gap-2 text-slate-600 font-semibold text-[11px] sm:text-xs">
          <i class="fa-solid fa-circle-info text-sky-500"></i>
          <span>Net Worth = Cash + Properties + Buildings</span>
        </div>
        <button onclick="window.closeLeaderboardModal()" class="game-btn game-btn-blue px-6 py-2 text-xs font-black shadow-xs">
          Close
        </button>
      </div>

    </div>
  </div>
