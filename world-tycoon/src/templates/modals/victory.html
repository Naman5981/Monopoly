  <div id="modal-victory" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[9999] hidden items-center justify-center p-3 sm:p-5 overflow-y-auto overscroll-contain">
    <!-- Rotating Radiant Sunburst Background -->
    <div class="fixed inset-0 flex items-center justify-center pointer-events-none opacity-20">
      <div class="w-[640px] h-[640px] sm:w-[860px] sm:h-[860px] rounded-full victory-sunburst animate-spin-slow"></div>
    </div>

    <!-- Victory Celebration Card -->
    <div id="victory-card" class="relative bg-white/95 backdrop-blur-xl border-4 border-amber-400 rounded-3xl max-w-md w-full max-h-[92vh] overflow-hidden shadow-[0_0_60px_rgba(245,158,11,0.5)] transform flex flex-col z-10 victory-card-animate my-auto">
      <!-- Grand Banner Header -->
      <div class="relative p-5 sm:p-6 pb-4 sm:pb-5 text-center text-white overflow-hidden bg-gradient-to-br from-amber-500 via-yellow-500 to-amber-600 shadow-md flex-shrink-0">
        <!-- Background watermark icons -->
        <svg class="ui-watermark -right-3 -top-3 w-28 h-28 text-white/10" aria-hidden="true"><use href="#icon-crown"></use></svg>
        <svg class="ui-watermark -left-3 -bottom-3 w-28 h-28 text-white/10" aria-hidden="true"><use href="#icon-sparkle"></use></svg>

        <!-- Pill badge -->
        <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-black/20 backdrop-blur-md text-xs font-black uppercase tracking-widest text-amber-100 shadow-xs mb-2 border border-white/20">
          <svg class="ui-icon w-3.5 h-3.5 text-amber-300" aria-hidden="true"><use href="#icon-trophy"></use></svg>
          <span>VICTORY ROYALE</span>
          <svg class="ui-icon w-3.5 h-3.5 text-amber-300" aria-hidden="true"><use href="#icon-trophy"></use></svg>
        </div>

        <!-- Giant Animated Trophy with Sparkles -->
        <div class="my-1 relative inline-block">
          <span class="text-6xl sm:text-7xl block filter trophy-glow select-none animate-bounce">🏆</span>
          <span class="absolute -top-1 -right-2 text-2xl animate-ping">✨</span>
          <span class="absolute -bottom-1 -left-2 text-xl animate-pulse">⭐</span>
        </div>

        <h2 id="victory-title" class="font-rounded font-black text-3xl sm:text-4xl text-white tracking-wide drop-shadow-md">
          YOU WON!
        </h2>
        <p id="victory-subtitle" class="font-extrabold text-xs sm:text-sm text-amber-100 tracking-wide drop-shadow mt-1">
          Supreme World Real Estate Tycoon
        </p>
      </div>

      <!-- Stats & Accolades Body -->
      <div class="p-4 sm:p-5 space-y-3.5 overflow-y-auto flex-1">
        <!-- Champion Accolade Box -->
        <div class="bg-gradient-to-r from-amber-50 to-yellow-50 border-2 border-amber-300 rounded-2xl p-3.5 flex items-center gap-3.5 shadow-xs">
          <span id="victory-accolade-icon" class="text-3xl select-none">👑</span>
          <div>
            <div id="victory-accolade-title" class="text-xs sm:text-sm font-black text-amber-950 uppercase tracking-wider">GLOBAL TYCOON SUPREMACY!</div>
            <div id="victory-accolade-desc" class="text-xs sm:text-sm font-semibold text-amber-900 mt-0.5">All rival tycoons bankrupted. You rule the entire global real estate empire!</div>
          </div>
        </div>

        <!-- Winner Stats Grid -->
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 text-center">
            <div class="text-xs font-black text-slate-600 uppercase tracking-wider">Final Cash</div>
            <div id="victory-stat-cash" class="font-rounded font-black text-xl text-emerald-600 mt-0.5">$0</div>
          </div>
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 text-center">
            <div class="text-xs font-black text-slate-600 uppercase tracking-wider">Empire Cities</div>
            <div id="victory-stat-props" class="font-rounded font-black text-xl text-indigo-600 mt-0.5">0</div>
          </div>
        </div>

        <!-- Net Worth Timeline Trajectory Graph -->
        <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 text-center space-y-1.5">
          <div class="text-[11px] font-black text-slate-700 uppercase tracking-wider flex items-center justify-between px-1">
            <span class="flex items-center gap-1.5"><i class="fa-solid fa-chart-line text-sky-600"></i> Net Worth Trajectory</span>
            <span class="text-[10px] text-slate-500 font-bold">Match Timeline</span>
          </div>
          <div id="victory-timeline-chart" class="w-full h-36 flex items-center justify-center overflow-hidden"></div>
        </div>

        <!-- Match Completion Star Reward Card (better-interface) -->
        <div id="victory-reward-card" class="bg-gradient-to-r from-amber-50 via-yellow-50 to-amber-100/90 border-2 border-amber-300 rounded-2xl p-3.5 shadow-sm space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black uppercase text-amber-950 tracking-wider flex items-center gap-1.5">
              <i class="fa-solid fa-star text-amber-500 text-sm"></i> Tycoon Stars Earned
            </span>
            <span id="victory-reward-total" class="font-rounded font-black text-xl text-amber-600 tabular-nums">
              +0 ⭐
            </span>
          </div>
          <div id="victory-reward-breakdown" class="text-[11px] text-amber-900 font-bold flex flex-wrap gap-1.5">
            <!-- Dynamically populated tags -->
          </div>
          <div class="pt-1.5 flex items-center justify-between border-t border-amber-200/80">
            <span class="text-xs font-extrabold text-slate-600">Total Balance: <strong id="victory-profile-balance" class="text-slate-900 tabular-nums">500 ⭐</strong></span>
            <button onclick="window.openWardrobeModal()" class="px-3 py-1.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs shadow-xs border border-amber-500/30 flex items-center gap-1.5 cursor-pointer transition-transform active:scale-95" title="Open Wardrobe & customize character">
              <span>👔 Open Wardrobe</span>
            </button>
          </div>
        </div>

        <!-- Multiplayer Status / Notice Banner -->
        <div id="victory-multiplayer-status" class="hidden text-xs font-bold text-center py-2.5 px-3.5 rounded-xl bg-amber-50 border-2 border-amber-300 text-amber-900 shadow-xs"></div>
      </div>

      <!-- Action Footer with Fixed Bottom Buttons -->
      <div class="p-3.5 sm:p-4 border-t border-slate-100 bg-white/95 flex-shrink-0 grid grid-cols-2 gap-3 shadow-inner">
        <!-- Return to Lobby Button -->
        <button id="btn-victory-lobby" onclick="window.handleReturnToLobbyFromVictory()" class="py-3 px-3 rounded-2xl font-rounded font-black text-sm sm:text-base text-sky-800 bg-sky-50 hover:bg-sky-100 border-2 border-sky-300 shadow-md flex items-center justify-center gap-2 cursor-pointer transition-[transform,background-color,box-shadow] duration-150 ease-out hover:scale-[1.02] enabled:active:scale-[0.96]" title="Return to Table Lobby with all players">
          <i class="fa-solid fa-users text-sky-600 text-base"></i>
          <span>LOBBY</span>
        </button>

        <!-- Big Grand Play Again Button -->
        <button id="btn-victory-play-again" onclick="window.handlePlayAgainAction()" class="game-btn game-btn-green py-3 px-3 text-sm sm:text-base font-black shadow-xl flex items-center justify-center gap-2 group hover:scale-[1.02] enabled:active:scale-[0.96] transition-[transform,box-shadow,filter] duration-150 ease-out" title="Start immediate rematch">
          <i class="fa-solid fa-rotate-right text-base group-hover:rotate-45 transition-transform"></i>
          <span id="btn-victory-play-again-text">PLAY AGAIN</span>
        </button>
      </div>
    </div>
  </div>
