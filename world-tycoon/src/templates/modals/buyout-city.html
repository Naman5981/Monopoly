  <div id="modal-buyout-city" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden items-center justify-center p-4 overscroll-contain">
    <div id="modal-buyout-city-card" class="game-modal-shell modal-shell-amber max-w-md w-full">
      <div id="buyout-modal-header" class="game-modal-header h-36 p-4 flex flex-col justify-between items-center text-center text-white relative shadow-md bg-gradient-to-r from-amber-600 via-orange-600 to-rose-600">
        <!-- Floating Watermark Icons -->
        <svg class="ui-watermark absolute -right-2 -top-2 w-20 h-20 text-white opacity-15" aria-hidden="true"><use href="#icon-building"></use></svg>
        <svg class="ui-watermark absolute -left-2 -bottom-2 w-20 h-20 text-white opacity-15" aria-hidden="true"><use href="#icon-sparkle"></use></svg>

        <span id="buyout-modal-country" class="modal-badge-pill bg-black/30 border border-white/30 text-amber-200">⚔️ HOSTILE BUYOUT</span>
        <canvas id="buyout-city-3d-canvas" width="220" height="110" class="w-[180px] h-[90px] -my-2 relative z-10 pointer-events-none drop-shadow-xl"></canvas>
        <h3 id="buyout-modal-name" class="modal-city-title">LONDON</h3>
      </div>
      <div class="p-5 space-y-3.5 bg-gradient-to-b from-white to-slate-50/70">
        <!-- Current Owner Pill -->
        <div id="buyout-modal-owner" class="text-xs sm:text-sm font-display font-black text-center py-2 px-3 rounded-2xl bg-amber-50 text-amber-950 border-2 border-amber-300 shadow-2xs">
          Acquire from <strong>Opponent</strong>
        </div>

        <!-- 3D Stat Cards: Buyout Cost Breakdown -->
        <div class="grid grid-cols-2 gap-3">
          <div class="game-stat-card stat-card-sky">
            <span class="stat-card-badge">
              <i class="fa-solid fa-tag text-sky-500"></i> 2× BASE PRICE
            </span>
            <div id="buyout-modal-base-price" class="stat-card-value text-sky-950">600K</div>
          </div>
          <div class="game-stat-card stat-card-emerald">
            <span class="stat-card-badge">
              <i class="fa-solid fa-house text-emerald-500"></i> HOUSES BUILT
            </span>
            <div id="buyout-modal-houses-cost" class="stat-card-value text-emerald-950">320K</div>
          </div>
        </div>

        <!-- Total Buyout Cost Highlight Box -->
        <div class="p-3 bg-gradient-to-r from-amber-500/10 via-orange-500/10 to-rose-500/10 rounded-2xl border-2 border-amber-400 flex items-center justify-between">
          <div>
            <div class="text-[10px] font-black uppercase text-amber-800 tracking-wider">TOTAL BUYOUT COST</div>
            <div id="buyout-modal-total-cost" class="text-xl font-black text-amber-950">$920K</div>
          </div>
          <div class="text-right">
            <div class="text-[10px] font-black uppercase text-slate-500 tracking-wider">YOUR BALANCE</div>
            <div id="buyout-modal-balance" class="text-sm font-black text-emerald-600">$1.50M</div>
          </div>
        </div>

        <div class="flex gap-3 pt-1">
          <button id="btn-confirm-buyout" onclick="window.confirmBuyoutCity()" class="game-btn game-btn-orange flex-1 py-3.5 text-sm font-black shadow-lg">
            <i class="fa-solid fa-handshake mr-1"></i> BUYOUT CITY
          </button>
          <button id="btn-pass-buyout" onclick="window.passBuyoutCity()" class="game-btn game-btn-slate flex-1 py-3.5 text-sm font-black">
            <i class="fa-solid fa-forward mr-1"></i> PASS
          </button>
        </div>
      </div>
    </div>
  </div>
