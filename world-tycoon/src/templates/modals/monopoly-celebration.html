  <div id="modal-monopoly-celebration" class="fixed inset-0 z-[9999] hidden items-center justify-center p-4 select-none cursor-pointer overscroll-contain overflow-y-auto" onclick="window.closeMonopolyModal()">
    <!-- 1. Deep Dimmed Backdrop with Radial Vignette & Sunburst God Rays -->
    <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-md transition-opacity duration-300"></div>
    <div class="monopoly-sunburst-rays pointer-events-none"></div>

    <!-- 2. Main Floating Celebration Stage (Center Column) -->
    <div id="modal-monopoly-card" class="relative z-10 flex flex-col items-center max-w-xl w-full pointer-events-auto cursor-default" onclick="event.stopPropagation()">

      <!-- Player Avatar Hero Disc -->
      <div id="monopoly-avatar-disc" class="monopoly-avatar-disc">
        <canvas id="monopoly-avatar-canvas" width="128" height="128" class="w-full h-full object-cover hidden"></canvas>
        <div id="monopoly-avatar-fallback" class="w-full h-full flex flex-col items-center justify-center text-white">
          <span id="monopoly-avatar-icon" class="text-3xl sm:text-4xl drop-shadow">🎩</span>
          <span id="monopoly-avatar-initial" class="text-xs sm:text-sm font-black uppercase tracking-wider drop-shadow-sm mt-0.5">YOU</span>
        </div>
      </div>

      <!-- Property Deed Cards Container (Side-by-Side Tangible Cards) -->
      <div id="monopoly-cards-row" class="monopoly-cards-row">
        <!-- Dynamically injected real estate deed cards -->
      </div>

      <!-- Folded Ribbon Banner (3D Swallowtail Banner) -->
      <div class="relative z-20 w-full max-w-lg px-2 flex flex-col items-center">
        <!-- 3D Ribbon Shell -->
        <div class="monopoly-ribbon-wrapper">
          <!-- Left Swallowtail Ribbon Tail -->
          <div class="monopoly-ribbon-tail-left"></div>
          <!-- Left Ribbon Fold -->
          <div class="monopoly-ribbon-fold-left"></div>

          <!-- Main Center Ribbon Plate -->
          <div class="monopoly-ribbon-plate">
            <h2 id="monopoly-ribbon-title" class="monopoly-ribbon-headline">
              MONOPOLY!
            </h2>
            <p id="monopoly-ribbon-subtitle" class="monopoly-ribbon-subline">
              <span id="monopoly-winner-name" class="font-black text-slate-900">Player</span> completed a color group: rents doubled!
            </p>
          </div>

          <!-- Right Ribbon Fold -->
          <div class="monopoly-ribbon-fold-right"></div>
          <!-- Right Swallowtail Ribbon Tail -->
          <div class="monopoly-ribbon-tail-right"></div>
        </div>

        <!-- Tap anywhere to continue hint / quick dismiss button -->
        <button onclick="window.closeMonopolyModal()" class="monopoly-dismiss-pill">
          Tap anywhere to continue
        </button>
      </div>

    </div>
  </div>
