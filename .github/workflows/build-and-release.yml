name: Build & Release Game Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Executables
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './world-tycoon/package-lock.json'

      - name: Install dependencies & compile CSS
        working-directory: ./world-tycoon
        run: |
          npm ci
          node ./node_modules/tailwindcss/lib/cli.js -i ./src/style.css -o ./src/compiled.css --minify
          node ./node_modules/tailwindcss/lib/cli.js -i ./src/style.css -o ./public/compiled.css --minify

      - name: Strip Debug Mode for Production Release
        shell: pwsh
        run: |
          node ./scripts/set-debug-mode.js --disable

      - name: Build Windows Standalone Executable & Packages
        shell: pwsh
        run: |
          .\build_all.ps1

      - name: Verify Generated Executables
        shell: pwsh
        run: |
          if (-not (Test-Path "WorldTycoon.exe")) { throw "WorldTycoon.exe was not created!" }
          if (-not (Test-Path "WorldTycoon_Online_Game.zip")) { throw "WorldTycoon_Online_Game.zip was not created!" }
          if (-not (Test-Path "WorldTycoon-Mac.zip")) { throw "WorldTycoon-Mac.zip was not created!" }
          $exe = Get-Item "WorldTycoon.exe"
          Write-Host "Executable built successfully: $($exe.FullName) ($($exe.Length) bytes)" -ForegroundColor Green

      - name: Upload WorldTycoon.exe (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WorldTycoon.exe
          path: WorldTycoon.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload All Game Packages (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: WorldTycoon-All-Packages
          path: |
            WorldTycoon.exe
            WorldTycoon_Online_Game.zip
            WorldTycoon-Mac.zip
          retention-days: 90

      - name: Refresh Rolling Release Timestamp
        shell: pwsh
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases (Rolling Release)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "World Tycoon: Global Edition (Latest Build)"
          body: |
            # 🎲 World Tycoon: Global Edition (Latest Build)

            [![Platform: Windows & macOS](https://img.shields.io/badge/Platform-Windows%20%7C%20macOS-blue?style=for-the-badge&logo=windows&logoColor=white)](https://github.com/${{ github.repository }}/releases/tag/latest)
            [![Three.js](https://img.shields.io/badge/Three.js-r128-black?style=for-the-badge&logo=three.js)](https://threejs.org/)
            [![WebRTC](https://img.shields.io/badge/Multiplayer-WebRTC%20P2P-339933?style=for-the-badge&logo=webrtc&logoColor=white)](https://peerjs.com/)
            [![Build & Release](https://img.shields.io/github/actions/workflow/status/${{ github.repository }}/build-and-release.yml?branch=main&style=for-the-badge&label=Build%20%26%20Release)](https://github.com/${{ github.repository }}/actions/workflows/build-and-release.yml)

            A 3D Monopoly board game built with Three.js, WebRTC P2P multiplayer, and Tailwind CSS. Play solo against AI bots or join an online game with friends using a room code.

            ---

            ## Downloads

            | Platform | Download | Package Type | Notes |
            | :--- | :--- | :--- | :--- |
            | Windows | [WorldTycoon.exe](https://github.com/${{ github.repository }}/releases/download/latest/WorldTycoon.exe) | Standalone EXE (~23 MB) | No install needed. Double-click to play. |
            | Windows | [WorldTycoon_Online_Game.zip](https://github.com/${{ github.repository }}/releases/download/latest/WorldTycoon_Online_Game.zip) | Portable ZIP (~22 MB) | Portable directory with batch launcher. |
            | macOS | [WorldTycoon-Mac.zip](https://github.com/${{ github.repository }}/releases/download/latest/WorldTycoon-Mac.zip) | App Bundle (~450 KB) | Extract and open WorldTycoon.app. |

            ---

            ## Features

            - **P2P Multiplayer**: Connect directly with friends using 4-character room codes over WebRTC.
            - **Solo Play with AI**: Fill open seats with bots to play solo.
            - **3D World Board**: 32 international cities, dynamic day/sunset/night lighting, and visible buildings on tiles.
            - **Trading & Upgrades**: Acquire properties, complete color sets, build houses and skyscrapers, and trade with players.
            - **Special Tiles**: Tropical Island jail, World Festival rent boost, Airport travel, and Chance cards.
            - **Built-in Sound**: Procedural Web Audio effects for dice rolls, token hops, and purchases.

            ---

            ## Controls

            | Action | Input |
            | :--- | :--- |
            | Roll dice / Confirm turn | Spacebar or click Roll |
            | Rotate camera | Right-click + drag, or Middle-click + drag |
            | Pan camera | Left-click + drag |
            | Zoom | Mouse wheel |

            ---

            **Commit:** `${{ github.sha }}`
          draft: false
          prerelease: false
          files: |
            WorldTycoon.exe
            WorldTycoon_Online_Game.zip
            WorldTycoon-Mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
